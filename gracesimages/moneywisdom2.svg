<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 505.77 271.89"><defs><style>.cls-1{font-size:38px;fill:#fcd268;font-family:Charter-BoldItalic, Charter;font-weight:700;font-style:italic;}.cls-2{font-size:29px;font-family:Charter-Roman, Charter;font-weight:400;font-style:normal;}.cls-3{letter-spacing:-0.1em;}.cls-4{letter-spacing:-0.13em;}</style></defs><g id="Layer_2" data-name="Layer 2"><g id="Layer_2-2" data-name="Layer 2"><text class="cls-1" transform="translate(2.58 31.75)">A little money wisdom:<tspan class="cls-2"><tspan class="cls-3" x="0" y="76.8">Y</tspan><tspan x="14.22" y="76.8">ou don’t have to stop enjoying your </tspan><tspan x="0" y="111.6">twenties to be good with mone</tspan><tspan class="cls-4" x="391.99" y="111.6">y</tspan><tspan x="402.5" y="111.6">. Start </tspan><tspan x="0" y="146.4">small, know what you can afford, and </tspan><tspan x="0" y="181.2">remember that even putting a little </tspan><tspan x="0" y="216">aside can make a difference.</tspan></tspan></text></g></g></svg>